[package]
name = "rust-browser"
version = "0.1.0"
description = "A desktop browser shell built with Tauri, Rust, and Svelte."
authors = ["Rust Browser Contributors"]
edition = "2021"
rust-version = "1.77.2"

[dependencies]
tauri = { version = "2.11", features = ["devtools", "unstable"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
scraper = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
urlencoding = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
