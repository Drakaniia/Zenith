[package]
name = "zenith-cef-phase1"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
description = "Phase 1 CEF runtime, trusted UI bridge, isolation, and lifecycle spike for Zenith"

[dependencies]
# Pinned official prebuilt CEF binary distribution (Chromium 156.0.31).
# No wry or webview2 dependency anywhere in this spike.
cef = "=156.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
]
