name: Docs

on:
  push:
    branches: ["main"]
    paths:
      - "apps/docs/**"
      - "packages/brand/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "apps/docs/**"
      - "packages/brand/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push replaces a queued one but never cancels a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the docs site
        run: pnpm docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  # Publishes https://drakaniia.github.io/Zenith/ (repository Settings › Pages › Source must be
  # "GitHub Actions"). Pull requests only build.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
