name: Docs

on:
  push:
    branches: ["main"]
    paths:
      - "apps/docs/**"
      - "packages/brand/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "apps/docs/**"
      - "packages/brand/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the docs site
        run: pnpm docs:build
      # Uploaded as a Pages artifact so a deploy job can be added later. There is no deploy
      # job yet: deployment waits on the hosting decision (and `site` in apps/docs/astro.config.mjs).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist
