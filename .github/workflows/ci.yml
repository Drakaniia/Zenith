name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check project structure
        run: pnpm check:structure
      - name: Check frontend
        run: pnpm check
      - name: Test frontend
        run: pnpm test
      - name: Build frontend for Rust tests
        run: pnpm --filter @zenith/desktop build
      - name: Test backend
        run: pnpm test:rust
