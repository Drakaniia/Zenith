[package]
name = "zenith-setup"
version = "0.2.0"
description = "Lightweight web stub installer for Zenith"
edition = "2021"
rust-version = "1.90"
publish = false

[features]
preview = []

[dependencies]
base64 = "0.22"
minisign-verify = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Networking_WinHttp",
  "Win32_System_LibraryLoader",
  "Win32_UI_Controls",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
