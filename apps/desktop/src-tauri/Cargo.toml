[package]
name = "zenith"
version = "0.3.0"
description = "Zenith: a lightweight Zen-style web browser for Windows"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "zenith"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
# Honour ZENITH_REMOTE_DEBUG_PORT in release builds (always honoured in debug builds).
remote-debug = []
signer = ["dep:minisign"]

[[bin]]
name = "zenith-sign"
path = "src/bin/zenith-sign.rs"
required-features = ["signer"]

[dependencies]
# Pinned official prebuilt CEF binary distribution (Chromium 156.0.31).
# No Tauri, wry, or WebView2 runtime dependencies.
cef = "=156.7.0"
# Full Adblock Plus / EasyList / EasyPrivacy network + cosmetic filtering (thread-safe).
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
url = "2"
minisign-verify = "0.3"
minisign = { version = "0.10", optional = true }
semver = "1"
png = "0.18"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rt-multi-thread/net/io-util: async runtime, torrent engine, and local streaming server.
tokio = { version = "1", features = ["sync", "rt-multi-thread", "net", "io-util", "time"] }
# Torrent and magnet downloads (DHT, PEX, persistence, rate limits, streaming).
librqbit = { version = "9.1", default-features = false, features = ["default-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
# Password vault: Argon2id key derivation, AES-256-GCM, keyed hashes, wiping secrets.
aes-gcm = "0.10"
argon2 = "0.5"
sha2 = "0.10"
zeroize = "1"
getrandom = "0.2"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_NetworkManagement_WiFi",
  "Win32_Networking_WinHttp",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_EnhancedStorage",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
]

[profile.dev]
incremental = true

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
